name: Stamp Last Updated

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'OpenClaw/**'
      - '.github/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Last updated stamps
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          changed=0
          for f in README.md CONTRIBUTING.md OpenClaw/thryx/SOUL.md OpenClaw/thryx/SKILL.md OpenClaw/thryx/CONSTITUTION.md OpenClaw/thryx/HEARTBEAT.md; do
            if [ -f "$f" ]; then
              if grep -qE '^\*Last updated: [0-9]{4}-[0-9]{2}-[0-9]{2}\*$' "$f"; then
                sed -i -E "s/^\*Last updated: [0-9]{4}-[0-9]{2}-[0-9]{2}\*$/*Last updated: ${TODAY}*/" "$f"
                changed=$((changed+1))
              fi
            fi
          done
          echo "Updated $changed file(s) to ${TODAY}"

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: stamp Last updated $(date -u +%Y-%m-%d) [skip ci]"
            git push
          else
            echo "No stamp changes needed."
          fi
